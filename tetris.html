<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>테트리스 게임</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            display: flex;
            gap: 30px;
            align-items: flex-start;
        }

        .game-area {
            background: #111;
            border: 3px solid #00ff00;
            border-radius: 5px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
        }

        #gameBoard {
            display: grid;
            grid-template-columns: repeat(10, 30px);
            grid-template-rows: repeat(20, 30px);
            gap: 0;
            background: #000;
            padding: 0;
        }

        .block {
            width: 30px;
            height: 30px;
            border: 1px solid #333;
            background: #111;
        }

        .block.empty {
            background: #111;
        }

        .block.filled {
            border: 1px solid #000;
        }

        /* 테트로미노 색상 */
        .I { background: #00ffff; }
        .O { background: #ffff00; }
        .T { background: #ff00ff; }
        .S { background: #00ff00; }
        .Z { background: #ff0000; }
        .J { background: #0000ff; }
        .L { background: #ff8800; }

        .sidebar {
            color: #00ff00;
            font-size: 16px;
            min-width: 200px;
        }

        .sidebar h1 {
            margin-bottom: 20px;
            text-shadow: 0 0 10px #00ff00;
            font-size: 28px;
        }

        .info-box {
            background: rgba(0, 255, 0, 0.1);
            border: 2px solid #00ff00;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 5px;
        }

        .info-box label {
            display: block;
            font-size: 12px;
            opacity: 0.7;
            margin-bottom: 5px;
        }

        .info-box .value {
            font-size: 24px;
            font-weight: bold;
        }

        .controls {
            background: rgba(0, 255, 0, 0.1);
            border: 2px solid #00ff00;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 5px;
        }

        .controls h3 {
            margin-bottom: 10px;
            font-size: 14px;
        }

        .control-item {
            font-size: 12px;
            margin-bottom: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #00ff00;
            color: #000;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s;
        }

        button:hover {
            background: #00dd00;
            transform: scale(1.05);
        }

        button:active {
            transform: scale(0.95);
        }

        .game-over {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            border: 3px solid #ff0000;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            z-index: 1000;
            color: #00ff00;
        }

        .game-over h2 {
            font-size: 36px;
            margin-bottom: 20px;
            color: #ff0000;
        }

        .game-over p {
            font-size: 18px;
            margin-bottom: 10px;
        }

        .game-over button {
            margin-top: 20px;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .block.filled {
            animation: pulse 0.6s ease-in-out;
        }

        .block.deleted {
            animation: delete-row 0.3s ease-out;
        }

        @keyframes delete-row {
            0% { background: #ffff00; }
            100% { background: #000; }
        }

        /* 미리보기 보드 */
        .next-box {
            background: rgba(0, 255, 0, 0.1);
            border: 2px solid #00ff00;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 5px;
        }

        .next-box label {
            display: block;
            font-size: 12px;
            opacity: 0.7;
            margin-bottom: 10px;
        }

        #nextBoard {
            display: grid;
            grid-template-columns: repeat(4, 25px);
            grid-template-rows: repeat(4, 25px);
            gap: 0;
            background: #000;
            padding: 5px;
            border-radius: 3px;
        }

        #nextBoard .block {
            width: 25px;
            height: 25px;
            border: 1px solid #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="game-area">
            <div id="gameBoard"></div>
        </div>

        <div class="sidebar">
            <h1>🎮 테트리스</h1>

            <div class="info-box">
                <label>점수</label>
                <div class="value" id="score">0</div>
            </div>

            <div class="info-box">
                <label>레벨</label>
                <div class="value" id="level">1</div>
            </div>

            <div class="info-box">
                <label>라인</label>
                <div class="value" id="lines">0</div>
            </div>

            <div class="next-box">
                <label>다음 도형</label>
                <div id="nextBoard"></div>
            </div>

            <div class="controls">
                <h3>조작법</h3>
                <div class="control-item">← → : 좌우 이동</div>
                <div class="control-item">↓ : 빠른 하강</div>
                <div class="control-item">Space : 회전</div>
                <div class="control-item">P : 일시정지</div>
            </div>

            <button onclick="startGame()">게임 시작</button>
            <button onclick="togglePause()" id="pauseBtn">일시정지</button>
        </div>
    </div>

    <div class="game-over" id="gameOverModal">
        <h2>게임 오버!</h2>
        <p>최종 점수: <span id="finalScore">0</span></p>
        <p>달성 레벨: <span id="finalLevel">1</span></p>
        <button onclick="location.reload()">다시 시작</button>
    </div>

    <script src="tetris.js"></script>
</body>
</html>
